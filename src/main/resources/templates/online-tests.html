<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đề thi Online</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="font-sans bg-gray-50">

<div th:replace="~{header.html}"></div>

<main class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-lg rounded-lg">
  <h2 class="text-3xl font-bold mb-6 text-center text-blue-700">📚 Thư viện đề thi</h2>

  <!-- Nhóm đề thi tiếng Anh -->
  <section class="mb-8">
    <h3 class="text-xl font-semibold mb-4 text-gray-700">Đề thi tiếng Anh</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <a href="/online-tests" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 text-center">Tất cả</a>
      <a href="/ielts-academic" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 text-center">IELTS Academic</a>
      <a href="/ielts-general" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 text-center">IELTS General</a>

      <!-- Nếu là admin -->
      <div sec:authorize="hasRole('ADMIN')">
        <a href="/admin/toeic" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 text-center">TOEIC</a>
      </div>
      <!-- Nếu không phải admin -->
      <div sec:authorize="!hasRole('ADMIN')">
        <a href="/user/toeic" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 text-center">TOEIC</a>
      </div>
    </div>
  </section>

  <!-- Nhóm đề thi tiếng Trung -->
  <section class="mb-8">
    <h3 class="text-xl font-semibold mb-4 text-gray-700">Đề thi HSK (Tiếng Trung)</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <a href="/hsk-1" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 1</a>
      <a href="/hsk-2" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 2</a>
      <a href="/hsk-3" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 3</a>
      <a href="/hsk-4" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 4</a>
      <a href="/hsk-5" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 5</a>
      <a href="/hsk-6" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 text-center">HSK 6</a>
    </div>
  </section>

  <!-- Nhóm đề thi tiếng Hàn -->
  <section class="mb-8">
    <h3 class="text-xl font-semibold mb-4 text-gray-700">Đề thi TOPIK (Tiếng Hàn)</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <a href="/topik-i" class="bg-yellow-500 text-white py-2 px-4 rounded hover:bg-yellow-600 text-center">TOPIK I</a>
      <a href="/topik-ii" class="bg-yellow-500 text-white py-2 px-4 rounded hover:bg-yellow-600 text-center">TOPIK II</a>
    </div>
  </section>

  <!-- Nhóm đề thi THPT Quốc Gia -->
  <section>
    <h3 class="text-xl font-semibold mb-4 text-gray-700">Đề thi THPT Quốc Gia</h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <a href="/toan-thptqg" class="bg-purple-500 text-white py-2 px-4 rounded hover:bg-purple-600 text-center">Toán</a>
      <a href="/tieng-anh-thptqg" class="bg-purple-500 text-white py-2 px-4 rounded hover:bg-purple-600 text-center">Tiếng Anh</a>
      <a href="/sinh-hoc-thptqg" class="bg-purple-500 text-white py-2 px-4 rounded hover:bg-purple-600 text-center">Sinh học</a>
      <a href="/hoa-hoc-thptqg" class="bg-purple-500 text-white py-2 px-4 rounded hover:bg-purple-600 text-center">Hóa học</a>
      <a href="/vat-ly-thptqg" class="bg-purple-500 text-white py-2 px-4 rounded hover:bg-purple-600 text-center">Vật lý</a>
    </div>
  </section>
</main>

</body>
</html>
