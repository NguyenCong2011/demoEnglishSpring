<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Danh sách khóa học</title>
</head>
<body>
  <div th:replace="~{header.html}"></div>
  <div class="container mx-auto py-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Các khóa học online</h2>

    <div sec:authorize="hasRole('ADMIN')" class="flex justify-center mb-6">
      <a href="/admin/createCourse" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
        Tạo khóa học
      </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div th:each="course : ${courses}" class="bg-white border rounded-lg p-5 shadow hover:shadow-lg transition">
        <a th:href="@{/course/detail/{id}(id=${course.id})}" class="block space-y-2">
          <h3 class="text-xl font-semibold text-blue-600" th:text="${course.courseName}">Tên khóa học</h3>
          <p><strong>📝 Mô tả:</strong> <span th:text="${course.description}"></span></p>
          <p><strong>💰 Giá:</strong> <span th:text="${course.price} + ' đ'"></span></p>
          <p><strong>🕒 Thời lượng:</strong> <span th:text="${course.duration} + ' giờ'"></span></p>
          <p>
            <strong>📅 Trạng thái:</strong>
            <span th:if="${course.isActive}" class="text-green-600 font-medium">Đang mở</span>
            <span th:if="${!course.isActive}" class="text-gray-400">Chưa mở</span>
          </p>
        </a>
      </div>
    </div>
  </div>
  <div th:replace="~{footer.html}"></div>
</body>
</html>
