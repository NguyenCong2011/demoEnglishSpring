<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TOEIC Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .content-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .question-item {
            background-color: #f1f1f1;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .part-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .part-links button {
            padding: 10px;
            background-color: #f1f1f1;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .part-links button.active,
        .part-links button:hover {
            background-color: #007bff;
            color: white;
        }

        .hidden {
            display: none;
        }

        /* Timer CSS */
        #timer {
            position: fixed;
            top: 50px;
            right: 20px;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<!-- Header -->
<div th:replace="~{header.html}"></div>

<!-- Đồng hồ đếm ngược -->
<div id="timer">120:00</div>

<!-- Nội dung bài thi -->
<div class="content-container">
    <div class="part-links">
        <button onclick="filterPart(1)">Part 1</button>
        <button onclick="filterPart(2)">Part 2</button>
        <button onclick="filterPart(3)">Part 3</button>
        <button onclick="filterPart(4)">Part 4</button>
        <button onclick="filterPart(5)">Part 5</button>
        <button onclick="filterPart(6)">Part 6</button>
        <button onclick="filterPart(7)">Part 7</button>
    </div>

    <!-- Nếu audio là đường dẫn Cloudinary -->
    <div th:if="${toeicExam.audio != null and toeicExam.audio.startsWith('http')}">
        <audio controls th:attr="src=${toeicExam.audio}"></audio>
    </div>

    <!-- Nếu audio là file local -->
    <div th:if="${toeicExam.audio != null and !toeicExam.audio.startsWith('http')}">
        <audio controls>
            <source th:src="@{'/audio/' + ${toeicExam.audio}}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>



    <form method="post" th:action="@{/user/submit-toeic-exam}">
        <input type="hidden" name="examId" th:value="${examId}" />
        <input type="hidden" name="user1Id" th:value="${user1Id}" />
        <input type="hidden" name="user2Id" th:value="${user2Id}" />

        <div class="question-list">
            <div th:each="question, iter : ${toeicQuestions}"
                 th:attr="data-part=${question.part}"
                 class="question-item">
                <input type="hidden" name="questionIds" th:value="${question.questionId}" />

                <div th:if="${question.image != null}">
                    <img th:src="@{${question.image}}" alt="Question Image" style="max-width: 300px;" />
                </div>

                <p><strong>Question [[${iter.index + 1}]] (Part [[${question.part}]]):</strong>
                    <span th:text="${question.questionText}"></span></p>

                <label>
                    <input type="radio" th:name="'answers[' + ${question.questionId} + ']'" th:value="'Answer 1'" />
                    <span th:text="${question.dapAn1}"></span>
                </label><br/>

                <label>
                    <input type="radio" th:name="'answers[' + ${question.questionId} + ']'" th:value="'Answer 2'" />
                    <span th:text="${question.dapAn2}"></span>
                </label><br/>

                <label>
                    <input type="radio" th:name="'answers[' + ${question.questionId} + ']'" th:value="'Answer 3'" />
                    <span th:text="${question.dapAn3}"></span>
                </label><br/>

                <!-- Chỉ hiển thị Answer 4 nếu Part khác 2 -->
                <label th:if="${question.part != 2}">
                    <input type="radio" th:name="'answers[' + ${question.questionId} + ']'" th:value="'Answer 4'" />
                    <span th:text="${question.dapAn4}"></span>
                </label><br th:if="${question.part != 2}" />
            </div>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <button type="submit">Nộp bài</button>
        </div>
    </form>
</div>

<!-- jQuery CDN (chèn vào trước thẻ script sử dụng jQuery nếu chưa có) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    function filterPart(part) {
        $('.question-item').each(function () {
            const itemPart = $(this).data('part');
            if (part === 'all' || itemPart === part) {
                $(this).show();
            } else {
                $(this).hide();
            }
        });

        $('.part-links button').removeClass('active');
        if (part === 'all') {
            $('.part-links button:last-child').addClass('active');
        } else {
            $('.part-links button').eq(part - 1).addClass('active');
        }
    }

    function startTimer(duration, $display) {
        let timer = duration, minutes, seconds;
        const intervalId = setInterval(function () {
            minutes = Math.floor(timer / 60);
            seconds = timer % 60;

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            $display.text(minutes + ":" + seconds);

            if (--timer < 0) {
                clearInterval(intervalId);
                alert("Hết giờ! Bài thi sẽ được nộp tự động.");
                $('form').submit();
            }
        }, 1000);
    }

    $(document).ready(function () {
        filterPart(1); // Load Part 1 ban đầu

        const timeLimit = 120 * 60; // 120 phút tính bằng giây
        const $display = $('#timer');
        startTimer(timeLimit, $display);
    });
</script>

<script th:if="${#authorization.expression('isAuthenticated()')}">
    function getJwtFromCookie() {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; jwt=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }

    function refreshToken() {
        const token = getJwtFromCookie();
        if (!token) return;

        $.ajax({
            url: '/auth/refesh-token',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ token: token }),
            success: function (data) {
                document.cookie = `jwt=${data.result.token}; path=/`;
                console.log("✅ Token đã được làm mới");
            },
            error: function (err) {
                console.warn("❌ Refresh token lỗi:", err);
            }
        });
    }

    // Gọi refresh token mỗi 13 phút
    setInterval(refreshToken, 13 * 60 * 1000);
</script>

<!-- Footer -->
<div th:replace="~{footer.html}"></div>

</body>
</html>
